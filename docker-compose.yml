services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nimdoc-backend
    ports:
      - "8000:8000"
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-mock_nebius_key}
      - NEBIUS_API_BASE_URL=${NEBIUS_API_BASE_URL:-https://api.tokenfactory.nebius.ai/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-nvidia/meta-llama-3.1-8b-instruct}
      - VECTOR_DB_URL=http://qdrant:6333
      - VECTOR_DB_COLLECTION=nimdoc_documents
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: nimdoc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
